services:
  tenantcore_db:
    image: mysql:8.0
    container_name: tenantcore-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tenantcore
      MYSQL_USER: tenantcore
      MYSQL_PASSWORD: password
    ports:
      - "3311:3306"
    volumes:
      - tenantcore_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tenantcore_app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: tenantcore-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      - DB_HOST=tenantcore_db
      - DB_PORT=3306
      - DB_DATABASE=tenantcore
      - DB_USERNAME=tenantcore
      - DB_PASSWORD=password
      - LOG_CHANNEL=daily
      - LOG_DEPRECATIONS_CHANNEL=null
      - LOG_LEVEL=debug
    depends_on:
      tenantcore_db:
        condition: service_healthy

  tenantcore_web:
    image: nginx:alpine
    container_name: tenantcore-web
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/html:ro
    ports:
      - "8084:80"
    depends_on:
      - tenantcore_app

volumes:
  tenantcore_db:
